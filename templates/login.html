<!doctype html>
<html lang="ru">
<head>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=2">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=2"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Вход · Landingforyou</title><link rel="stylesheet" href="/admin.css"><script defer src="/admin.js"></script></head>
<body class="login-page">
  <main class="login-card">
    <a class="brand" href="/">Landingforyou<span>↗</span></a>
    <p class="eyebrow">CONTENT STUDIO</p>
    <h1>Вход в админку</h1>
    <form id="login-form" class="fields">
      <label>Логин<input name="username" autocomplete="username" required autofocus></label>
      <label>Пароль<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="primary">Войти →</button>
      <p role="status" id="login-status"></p>
    </form>
    <a class="back" href="/">Вернуться на сайт</a>
  </main>
</body>
</html>
